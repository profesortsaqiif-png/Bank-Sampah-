<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Perangkat - BSU Makkio Baji</title>
  <link rel="stylesheet" href="assets/css/stylelog.css">
</head>
<body>

<div class="auth-card">
  <img src="assets/img/logo bsu.png" alt="Logo Bank Sampah" class="auth-logo">
  <h2>BSU Makkio Baji</h2>
  <p>Sistem Pengelolaan Tabungan Sampah Digital</p>

  <div class="info-new-device">
    🔒 <strong>Akses Perangkat:</strong> Perangkat baru wajib Sign Up / Log In terlebih dahulu. Perangkat yang sudah pernah terdaftar akan otomatis mengenali akun Anda.
  </div>

  <!-- Switcher Mode Login / Sign Up -->
  <div class="tab-container">
    <button type="button" class="tab-btn active" id="tabLogin" onclick="pindahTab('login')">🔑 Log In</button>
    <button type="button" class="tab-btn" id="tabSignup" onclick="pindahTab('signup')">📝 Sign Up</button>
  </div>

  <!-- Form Log In -->
  <form id="formLogin" onsubmit="prosesLogin(event)">
    <div class="form-group">
      <label for="loginUsername">Username Admin:</label>
      <input type="text" id="loginUsername" placeholder="Masukkan username" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password:</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" required>
    </div>
    <button type="submit" class="btn-submit">Masuk Ke Panel Admin</button>
  </form>

  <!-- Form Sign Up -->
  <form id="formSignup" style="display: none;" onsubmit="prosesSignup(event)">
    <div class="form-group">
      <label for="signupNama">Nama Lengkap Pengurus/Admin:</label>
      <input type="text" id="signupNama" placeholder="Cth: Andi Intan" required>
    </div>
    <div class="form-group">
      <label for="signupUsername">Username Baru:</label>
      <input type="text" id="signupUsername" placeholder="Buat username" required>
    </div>
    <div class="form-group">
      <label for="signupPassword">Password Baru:</label>
      <input type="password" id="signupPassword" placeholder="Buat password" required>
    </div>
    <button type="submit" class="btn-submit" style="background-color: #1b5e20;">Daftarkan Akun & Perangkat</button>
  </form>

  <div id="alertMsg" class="alert-msg"></div>
</div>

<script>
  // Akun default sistem berbasis username
  const defaultAccounts = {
    "admin": { nama: "Administrator Utama", password: "admin123" }
  };

  // Mengambil basis data akun
  function getAccounts() {
    let accs = JSON.parse(localStorage.getItem("dbAccountsBSU"));
    if (!accs) {
      accs = defaultAccounts;
      localStorage.setItem("dbAccountsBSU", JSON.stringify(accs));
    }
    return accs;
  }

  // Mengambil/Membuat Device ID Unik untuk Perangkat Ini
  function getOrCreateDeviceId() {
    let devId = localStorage.getItem("active_device_bsu");
    if (!devId) {
      devId = 'DEV-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
      localStorage.setItem("active_device_bsu", devId);
    }
    return devId;
  }

  function pindahTab(mode) {
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const formLogin = document.getElementById("formLogin");
    const formSignup = document.getElementById("formSignup");
    const alertMsg = document.getElementById("alertMsg");

    alertMsg.style.display = "none";

    if (mode === 'login') {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      formLogin.style.display = "block";
      formSignup.style.display = "none";
    } else {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      formSignup.style.display = "block";
      formLogin.style.display = "none";
    }
  }

  function tampilPesan(pesan, tipe) {
    const alertMsg = document.getElementById("alertMsg");
    alertMsg.innerText = pesan;
    alertMsg.className = "alert-msg " + (tipe === 'error' ? "alert-error" : "alert-success");
    alertMsg.style.display = "block";
  }

  // Fungsi menyimpan status pendaftaran & login perangkat secara permanen
  function simpanSesiPerangkat(username, nama) {
    const deviceId = getOrCreateDeviceId();
    
    // Simpan daftar perangkat terdaftar
    const registeredDevices = JSON.parse(localStorage.getItem("registered_devices_bsu")) || {};
    registeredDevices[deviceId] = {
      username: username,
      registeredAt: new Date().toISOString()
    };
    localStorage.setItem("registered_devices_bsu", JSON.stringify(registeredDevices));

    // Simpan data sesi aktif
    const sessionData = {
      username: username,
      nama: nama,
      role: "admin",
      isLoggedIn: true,
      deviceId: deviceId,
      loginTime: new Date().toISOString()
    };
    localStorage.setItem("session_bsu", JSON.stringify(sessionData));
  }

  // PROSES LOG IN PERANGKAT
  function prosesLogin(e) {
    e.preventDefault();
    const username = document.getElementById("loginUsername").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value.trim();
    const dbAccounts = getAccounts();

    if (dbAccounts[username] && dbAccounts[username].password === password) {
      simpanSesiPerangkat(username, dbAccounts[username].nama);

      tampilPesan("Perangkat Berhasil Terotentikasi! Mengalihkan...", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    } else {
      tampilPesan("Username atau password salah!", "error");
    }
  }

  // PROSES SIGN UP PERANGKAT BARU
  function prosesSignup(e) {
    e.preventDefault();
    const nama = document.getElementById("signupNama").value.trim();
    const username = document.getElementById("signupUsername").value.trim().toLowerCase();
    const password = document.getElementById("signupPassword").value.trim();
    const dbAccounts = getAccounts();

    if (dbAccounts[username]) {
      tampilPesan(`Username "${username}" sudah terdaftar. Silakan gunakan Log In jika Anda sudah punya akun.`, "error");
      return;
    }

    // Pendaftaran Akun Baru
    dbAccounts[username] = {
      nama: nama,
      password: password
    };
    localStorage.setItem("dbAccountsBSU", JSON.stringify(dbAccounts));

    // Otomatis Daftarkan Perangkat dan Login
    simpanSesiPerangkat(username, nama);

    tampilPesan("Sign Up Berhasil! Perangkat terverifikasi, mengalihkan...", "success");
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  }

  // AUTO-LOGIN: Cek jika perangkat ini sudah pernah Sign Up / Log In sebelumnya
  window.onload = function() {
    const deviceId = localStorage.getItem("active_device_bsu");
    const registeredDevices = JSON.parse(localStorage.getItem("registered_devices_bsu")) || {};
    const session = JSON.parse(localStorage.getItem("session_bsu"));

    if (deviceId && registeredDevices[deviceId] && session && session.isLoggedIn && session.username) {
      window.location.href = "index.html";
    }
  };
</script>

</body>
</html>
