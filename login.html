<script>
  function getAccounts() {
    let accs = JSON.parse(localStorage.getItem("dbAccountsBSU"));
    if (!accs) {
      accs = { "admin": { nama: "Administrator Utama", password: "admin123" } };
      localStorage.setItem("dbAccountsBSU", JSON.stringify(accs));
    }
    return accs;
  }

  function getOrCreateDeviceId() {
    let devId = localStorage.getItem("active_device_bsu");
    if (!devId) {
      devId = 'DEV-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
      localStorage.setItem("active_device_bsu", devId);
    }
    return devId;
  }

  function tampilPesan(pesan, tipe) {
    const alertMsg = document.getElementById("alertMsg");
    alertMsg.innerText = pesan;
    alertMsg.className = "alert-msg " + (tipe === 'error' ? "alert-error" : "alert-success");
    alertMsg.style.display = "block";
  }

  function simpanSesiPerangkat(username, nama) {
    const deviceId = getOrCreateDeviceId();
    const registeredDevices = JSON.parse(localStorage.getItem("registered_devices_bsu")) || {};
    registeredDevices[deviceId] = {
      username: username,
      registeredAt: new Date().toISOString()
    };
    localStorage.setItem("registered_devices_bsu", JSON.stringify(registeredDevices));

    const sessionData = {
      username: username,
      nama: nama,
      role: "admin",
      isLoggedIn: true,
      deviceId: deviceId,
      loginTime: new Date().toISOString()
    };
    localStorage.setItem("session_bsu", JSON.stringify(sessionData));
  }

  // PROSES BUAT AKUN + GANTI (OVERWRITE) DAFTAR NASABAH
  function prosesBuatAkun(e) {
    e.preventDefault();
    const namaAdmin = document.getElementById("signupNamaAdmin").value.trim();
    const username = document.getElementById("signupUsername").value.trim().toLowerCase();
    const password = document.getElementById("signupPassword").value.trim();
    const rawTeksNasabah = document.getElementById("signupDaftarNasabah").value;

    const dbAccounts = getAccounts();

    if (dbAccounts[username]) {
      tampilPesan(`Username "${username}" sudah digunakan. Silakan pilih username lain!`, "error");
      return;
    }

    // 1. KUNCI PERUBAHAN: Dibuat objek kosong baru ({}) untuk MENGGANTI TOTAL database nasabah lama
    let dbNasabahBaru = {};
    let jumlahNasabah = 0;

    if (rawTeksNasabah && rawTeksNasabah.trim() !== "") {
      const daftarNamaList = rawTeksNasabah.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);

      daftarNamaList.forEach(namaNasabah => {
        const nextId = (jumlahNasabah + 1).toString();
        dbNasabahBaru[nextId] = {
          id: nextId,
          nama: namaNasabah,
          totalPendapatan: 0,
          totalPenarikan: 0,
          histori: []
        };
        jumlahNasabah++;
      });
    }

    // Simpan/Ganti Total Data Nasabah di LocalStorage
    localStorage.setItem("dbNasabahBSU_v3", JSON.stringify(dbNasabahBaru));

    // 2. Simpan Kredensial Akun Pengurus Baru
    dbAccounts[username] = {
      nama: namaAdmin,
      password: password
    };
    localStorage.setItem("dbAccountsBSU", JSON.stringify(dbAccounts));

    // 3. Simpan Sesi & Redirect
    simpanSesiPerangkat(username, namaAdmin);

    let pesanSukses = "Akun Berhasil Dibuat!";
    if (jumlahNasabah > 0) {
      pesanSukses += ` Database diperbarui dengan ${jumlahNasabah} nasabah baru.`;
    }
    pesanSukses += " Mengalihkan...";

    tampilPesan(pesanSukses, "success");
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1200);
  }

  window.onload = function() {
    const deviceId = localStorage.getItem("active_device_bsu");
    const registeredDevices = JSON.parse(localStorage.getItem("registered_devices_bsu")) || {};
    const session = JSON.parse(localStorage.getItem("session_bsu"));

    if (deviceId && registeredDevices[deviceId] && session && session.isLoggedIn && session.username) {
      window.location.href = "index.html";
    }
  };
</script>
